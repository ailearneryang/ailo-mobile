services:
  relay:
    build:
      context: ../..
      dockerfile: relay/deploy/Dockerfile
    environment:
      AILO_RELAY_BOOTSTRAP: ${AILO_RELAY_BOOTSTRAP:?set a random secret of at least 32 characters}
    volumes:
      - relay-data:/data
    ports:
      - "127.0.0.1:8787:8787"
    restart: unless-stopped
volumes:
  relay-data:
